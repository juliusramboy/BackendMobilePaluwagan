spring:
  application:
    name: MobilePaluwagan
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:backup}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
  bucket: ${BUCKET}

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-cors: ${ALLOWED_ORIGINS}
  logo:
    url: ${LOGO_URL}


