spring:
  application:
    name: MobilePaluwagan
  ai:
    openai:
      api-key: ${GROQ_API_KEY_1}
      base-url: ${GROQ_BASE_URL}
      chat:
        options:
          model: ${GROQ_MODEL}
          store: false
          stream-usage: false
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:backup}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 3
      keepalive-time: 60000
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL:false}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: Asia/Manila

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB


groq:
  fallback:
    api-key: ${GROQ_API_KEY_2}
    base-url: ${GROQ_BASE_URL}
    model: ${GROQ_MODEL}
  fallback2:
    api-key: ${GROQ_API_KEY_3}
    base-url: ${GROQ_BASE_URL}
    model: ${GROQ_MODEL}
  fallback3:
    api-key: ${GROQ_API_KEY_4}
    base-url: ${GROQ_BASE_URL}
    model: ${GROQ_MODEL}

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
  bucket: ${BUCKET}

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-cors: ${ALLOWED_ORIGINS}
  logo:
    url: ${LOGO_URL}

paymongo:
  secret-key: ${PAYMONGO_SECRET_KEY}
  public-key: ${PAYMONGO_PUBLIC_KEY}
  base-url: https://api.paymongo.com/v1
  webhook-secret: ${PAYMONGO_WEBHOOK_SECRET}

logging:
  level:
    org:
      apache:
        catalina:
          connector:
            CoyoteAdapter: ERROR
    org.hibernate.SQL: OFF
    org.hibernate.type: OFF
    org.springframework.web: ERROR

internal:
  secret-key: ${INTERNAL_SECRET_KEY}