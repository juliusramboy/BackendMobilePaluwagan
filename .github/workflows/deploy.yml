name: MobilePaluwagan CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: target/MobilePaluwagan-0.0.1-SNAPSHOT.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: .

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/id_rsa \
          MobilePaluwagan-0.0.1-SNAPSHOT.jar \
          ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/MobilePaluwagan.jar

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Stopping existing application..."
            sudo systemctl stop springboot || true

            echo "Writing environment variables..."
            cat > /home/ubuntu/app/.env << ENVEOF
  DB_URL=${{ secrets.DB_URL }}
  DB_USERNAME=${{ secrets.DB_USERNAME }}
  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
  SUPABASE_URL=${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
  BUCKET=${{ secrets.BUCKET }}
  MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
  JWT_SECRET=${{ secrets.JWT_SECRET }}
  SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}
  SPRING_REDIS_HOST=${{ secrets.SPRING_REDIS_HOST }}
  SPRING_REDIS_PORT=${{ secrets.SPRING_REDIS_PORT }}
  SPRING_REDIS_PASSWORD=${{ secrets.SPRING_REDIS_PASSWORD }}
  SPRING_REDIS_SSL=${{ secrets.SPRING_REDIS_SSL }}
  ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
  LOGO_URL=${{ secrets.LOGO_URL }}
  PAYMONGO_SECRET_KEY=${{ secrets.PAYMONGO_SECRET_KEY }}
  PAYMONGO_PUBLIC_KEY=${{ secrets.PAYMONGO_PUBLIC_KEY }}
  PAYMONGO_WEBHOOK_SECRET=${{ secrets.PAYMONGO_WEBHOOK_SECRET }}
  GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
  ENVEOF
  
  echo "Starting application..."
  sudo systemctl start springboot
  
  echo "Checking status..."
  sudo systemctl status springboot --no-pager
  
  echo "✅ Deployment complete!"
  EOF